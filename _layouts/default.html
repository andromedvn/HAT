<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: site.name }}</title>
    <style>
        :root {
            --background: #150F0B;
            --primary: #FFB878;
            --on-surface: #F0EAE5;
            --on-surface-variant: #C2B4A9;
        }
        body {
            background-color: var(--background);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 16px 20px 32px 20px; /* Exact Compose Padding */
            max-width: 800px;
        }
        .header-container {
            margin-bottom: 32px;
        }
        .dynamic-subtitle {
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--primary);
            font-weight: 500;
            margin-bottom: 4px;
        }
        h1 {
            font-size: 28px;
            font-weight: 700;
            color: var(--on-surface);
            margin: 0;
            letter-spacing: -0.5px;
        }
        h2 {
            font-size: 16px;
            font-weight: 600;
            color: var(--on-surface);
            margin: 32px 0 8px 0;
        }
        h3 {
            font-size: 14px;
            font-weight: 600;
            color: var(--on-surface);
            margin: 24px 0 8px 0;
        }
        p, ul, ol, td, th {
            font-size: 14px;
            color: var(--on-surface);
            line-height: 20px;
            margin-top: 0;
            margin-bottom: 16px;
        }
        ul { padding-left: 20px; }
        a { color: var(--primary); text-decoration: none; }
        hr { border: 0; margin: 32px 0; }
        
        /* The Monospace Boilerplate Illusion */
        pre {
            background: transparent;
            border: none;
            margin: 16px 0;
            padding: 0;
            white-space: pre-wrap;
        }
        code, pre code {
            font-family: monospace;
            font-size: 10px;
            color: var(--on-surface-variant);
            background: transparent;
            line-height: 14px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 16px;
        }
        th, td {
            text-align: left;
            padding: 8px 0;
        }
        th { color: var(--primary); font-weight: 600; }
    </style>
</head>
<body>
    <div class="header-container">
        <div class="dynamic-subtitle">{{ page.subtitle | default: "Legal & Compliance" }}</div>
        <h1>{{ page.heading | default: page.title }}</h1>
    </div>
    {{ content }}
</body>
</html>
