Summary: Screen time tracker that helps you track and label gaps when you are not using your phone
Description: |-
    Heuristic Activity Tracker (HAT) is more than just a screen time tracker, it helps you track and label gaps when you are not using your phone.

    * Every app session for any day, week, or month, clustered with the real total
    * The time you were not on your phone becomes a Gap, and you name it
    * The app never guesses: unaccounted time is a Gap, always
    * History archiving keeps your past before Android deletes it
    * No account, no INTERNET permission, no cloud. Everything stays on your device

